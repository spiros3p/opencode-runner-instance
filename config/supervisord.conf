; supervisord is PID 1. Services run as `agent` and inherit container env.
; opencode: native HTTP server on 127.0.0.1:4097 (sessions, prompts, events,
; credentials). It is fronted by opencode-gateway on 4096, which forwards
; everything and additionally implements POST /api/session/{id}/wait
; (upstream 1.x leaves wait as a stub that always answers 503).
; Repos are fetched by the `fetch-repo` helper, not by an HTTP service.

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[program:opencode]
command=/bin/bash -c 'exec opencode serve --hostname 127.0.0.1 --port 4097'
directory=/workspace
user=agent
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/agent",USER="agent",LOGNAME="agent"

; Gateway: external edge on 4096. Forwards to opencode on 127.0.0.1:4097 and
; implements POST /api/session/{id}/wait by polling messages until the turn
; settles (204), then the caller reads the reply via GET .../message.
; Env (all optional except OPENCODE_SERVER_PASSWORD, exported by entrypoint):
; GATEWAY_LISTEN_HOST/PORT, GATEWAY_UPSTREAM_HOST/PORT,
; WAIT_TIMEOUT_SECONDS (default 540), WAIT_POLL_SECONDS (default 1.5).
[program:gateway]
command=/bin/bash -c 'exec /usr/local/bin/opencode-gateway'
directory=/workspace
user=agent
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/agent",USER="agent",LOGNAME="agent"

; Opt-in UI. entrypoint normalizes ENABLE_CODE_SERVER to true/false.
[program:code-server]
autostart=%(ENV_ENABLE_CODE_SERVER)s
command=/bin/bash -c 'exec env PASSWORD="$CODE_SERVER_PASSWORD" code-server --bind-addr 0.0.0.0:8443 --auth password --disable-telemetry --disable-update-check /workspace'
directory=/workspace
user=agent
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/agent",USER="agent",LOGNAME="agent"
