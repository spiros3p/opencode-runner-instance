; supervisord is PID 1. Both services run as `agent` and inherit container env.
; opencode: native HTTP server on 4096 (sessions, prompts, events, credentials).
; provisioner: repo commissioning on 8300, clone-once registry in /workspace.

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[program:opencode]
command=/bin/bash -c 'exec opencode serve --hostname 0.0.0.0 --port 4096'
directory=/workspace
user=agent
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/agent",USER="agent",LOGNAME="agent"

[program:provisioner]
command=/usr/bin/python3 /usr/local/bin/provisioner.py
directory=/workspace
user=agent
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/agent",USER="agent",LOGNAME="agent"
