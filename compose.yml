services:
  runner:
    build: .
    image: opencode-runner:latest
    container_name: opencode-runner
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 8
    mem_limit: 6g
    env_file: .env
    environment:
      # gh reads GH_TOKEN. Set it in the container config, not only at runtime:
      # `docker exec` inherits Config.Env, not the entrypoint's exports.
      GH_TOKEN: ${FETCH_GITHUB_TOKEN:-}
    cap_drop: [ NET_ADMIN, NET_RAW, SYS_PTRACE ]
    ports:
      - "${BIND_IP:-0.0.0.0}:${OPENCODE_PORT:-4096}:4096"
    volumes:
      - ./workspace:/workspace
      - agent_home:/home/agent
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  agent_home:
    name: opencode_runner_home

networks:
  default:
    name: opencode_runner_default
